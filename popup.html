<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Study Blocker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>📚 Study Blocker</h1>

  <div id="status">Not focusing</div>

 <div id="setup-view">
  <div id="sites-section">
    <label for="site-input">Block this site:</label>
<input type="text" id="site-input" list="site-suggestions" placeholder="e.g. youtube.com">
<datalist id="site-suggestions">
  <option value="youtube.com">
  <option value="instagram.com">
  <option value="tiktok.com">
  <option value="reddit.com">
  <option value="facebook.com">
  <option value="twitter.com">
  <option value="x.com">
  <option value="netflix.com">
</datalist>
    <button id="add-site-btn">Add</button>

    <ul id="sites-list"></ul>
    
   <div id="limit-msg" style="display: none; color: #666; font-size: 12px;">
  Max 2 sites
</div>
  </div>
  </div>

  <label for="duration">Focus time (minutes):</label>
  <input type="number" id="duration" value="25" min="1" max="180">
  <button id="start-btn">Start Focus Mode</button>
</div>

  <div id="active-view" style="display: none;">
    <div id="timer" style="font-size: 28px; font-weight: bold;">00:00</div>
    <button id="stop-btn">Stop</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
