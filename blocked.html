<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Focus Mode</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }

    .emoji {
      font-size: 64px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 32px;
      margin: 0 0 12px 0;
      background: linear-gradient(135deg, #a78bfa, #818cf8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p {
      color: #c7d2fe;
      font-size: 16px;
      max-width: 320px;
      line-height: 1.5;
    }

    .quote {
      margin-top: 24px;
      font-size: 13px;
      color: #818cf8;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="emoji">📚</div>
  <h1>Focus Mode Active</h1>
  <p>This site is off-limits while you're studying. Close the tab and get back to it.</p>
  <div class="quote">"Discipline is choosing between what you want now and what you want most."</div>
</body>
</html>
